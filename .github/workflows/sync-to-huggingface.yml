name: Sync to Hugging Face

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install

      - name: Download LFS files
        run: |
          git lfs pull
          git lfs checkout

      - name: Verify model file
        run: |
          echo "Checking best_model FF.keras..."
          ls -lh "best_model FF.keras"
          echo "File size:"
          stat -c%s "best_model FF.keras"
          echo "First bytes:"
          head -c 20 "best_model FF.keras" | xxd

      - name: Sync to Hugging Face Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: shahd-ai/smart-precision-agriculture
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
