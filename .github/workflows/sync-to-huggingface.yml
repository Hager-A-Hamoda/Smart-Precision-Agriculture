name: Sync to Hugging Face

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Pull LFS files
        run: |
          git lfs install
          git lfs pull

      - name: Verify LFS model
        run: |
          ls -lh "best_model FF.keras"
          file "best_model FF.keras"

      - name: Sync to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: shahd-ai/smart-precision-agriculture
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
